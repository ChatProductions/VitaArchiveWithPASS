name: VitaArchive WithPASS build

on:
  push:
    branches:
      - fix/encrypted-rar-unrar
      - main
  pull_request:
  workflow_dispatch:

jobs:
  vita:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify VitaSDK UnRAR support
        run: |
          test -f "$VITASDK/arm-vita-eabi/include/unrar.h"
          test -f "$VITASDK/arm-vita-eabi/lib/libunrar.a"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile and package
        run: cmake --build build --parallel 2
      - name: Upload VPK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VitaArchiveWithPASS-VPK
          path: build/VitaArchive.vpk
          if-no-files-found: error
